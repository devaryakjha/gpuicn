name = "gpuicn"
homepage = "https://ui.imajha.com/"

# Every component includes theme. Dependencies are recursive and installed once.
[components.theme]
description = "The app-owned shadcn Neutral theme and shared native motion tokens for GPUI."
[components.field]
dependencies = ["input"]
[components.input]
description = "Nova-styled native text input with accessible labels, IME and standard editing shortcuts."
[components.textarea]
description = "Nova-styled multi-line text editor with retained native editing state."
dependencies = ["input"]
[components.input_group]
title = "Input Group"
description = "Inputs, textareas, addons and actions sharing one accessible frame."
dependencies = ["input", "button", "field"]
[components.carousel]
description = "Native snapping carousel with pointer, trackpad and keyboard navigation."
[components.empty]
description = "Composable empty-state media, copy and action layout."
[components.otp_field]
title = "OTP Field"
[components.alert_dialog]
dependencies = ["button", "dialog"]
[components.dialog]
dependencies = ["button"]
[components.drawer]
dependencies = ["button", "dialog"]
[components.popover]
dependencies = ["button"]
[components.toast]
dependencies = ["button"]
[components.menu]
dependencies = ["button"]
[components.menubar]
dependencies = ["menu"]
[components.context_menu]
dependencies = ["menu"]
[components.autocomplete]
dependencies = ["select"]
[components.combobox]
dependencies = ["select"]
[components.select]
dependencies = ["field"]
[components.navigation_menu]
dependencies = ["menubar"]
[components.sidebar]
description = "Shadcn-styled navigation composed from GPUI Kit buttons and scroll areas."
dependencies = ["scroll_area", "tooltip", "button", "dialog", "input", "menu"]
[components.resizable]
description = "Controlled shadcn-styled native GPUI resizable panes."
[components.virtual_list]
description = "Virtualized native rows with stable identity, selection, keyboard navigation and fixed row heights."
dependencies = ["scroll_area", "tooltip"]

[components.toolbar]
dependencies = ["input"]
[components.number_field]
dependencies = ["field"]

[components.kbd]
description = "Nova key caps that show shortcuts with each platform's modifier names."
[components.badge]
description = "Nova pills for labels and capped unread or mention counts."
[components.tag]
description = "Compact chips for statuses and roles, with an optional status dot and remove button."
dependencies = ["button"]
[components.spinner]
description = "A rotating Lucide loader announced as a status; it holds still under reduced motion."
[components.skeleton]
description = "Muted pulsing placeholders for content that is still loading."
[components.command]
description = "A Nova command palette and quick switcher with grouped, fuzzy-filtered, virtualized results."
dependencies = ["input", "dialog", "kbd"]
[components.message]
title = "Message"
description = "Team-chat message rows with grouping, mention highlights, reactions, hover actions and dividers."
dependencies = ["button"]
[components.message_list]
title = "Message List"
description = "A virtualized, variable-height chat transcript that follows new messages, with a jump-to-latest pill."
dependencies = ["button"]
[components.attachment]
description = "File and image attachment cards with upload progress, retry and remove."
dependencies = ["button"]
[components.title_bar]
title = "Title Bar"
description = "A draggable custom window title bar with platform window controls."

[components.markdown]
description = "Nova-styled Markdown with themed code blocks, tables, quotes and inline entity chips for mentions and channels."
