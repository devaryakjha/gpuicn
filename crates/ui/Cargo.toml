[package]
name = "gpuicn"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "shadcn components for GPUI, as a crate or as source you own."
readme = "README.md"
homepage = "https://ui.imajha.com/"
keywords = ["gpui", "shadcn", "ui", "components"]
categories = ["gui"]

[features]
native-fixture = ["dep:gpui_platform"]
# Syntax-highlights Markdown code blocks with GPUI Kit's syntect highlighter.
syntect = ["gpui-kit/syntect"]
# Registers components for GPUI Kit's element queries and adds `gpuicn::audit`,
# which lists or outlines controls without an accessible name. For tests and
# debug builds; release builds leave it off.
test-support = ["gpui-kit/test-support"]

[dependencies]
gpui-kit.workspace = true
web-time = "1.1"
gpui-icons.workspace = true
gpui_platform = { workspace = true, optional = true }

[dev-dependencies]
gpui-kit = { workspace = true, features = ["test-support"] }
serde_json = "1"

[[example]]
name = "theme_native"
required-features = ["native-fixture"]

[lints.rust]
missing_docs = "deny"

[[example]]
name = "desktop"
required-features = ["native-fixture"]
