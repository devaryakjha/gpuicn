[package]
name = "gpuicn-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Install editable gpuicn Rust components without Node.js."
publish = false

[[bin]]
name = "gpuicn"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.1", features = ["derive"] }
reqwest = { version = "0.12.28", default-features = false, features = ["blocking", "rustls-tls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.10.9"
syn = { version = "2.0.119", features = ["full", "parsing"] }
tempfile = "3.27.0"
toml = "0.8.23"
toml_edit = "0.22.27"
