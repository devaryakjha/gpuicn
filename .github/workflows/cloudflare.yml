name: Deploy ui.imajha.com

on:
  workflow_call:
    inputs:
      release_tag:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      release_tag:
        description: Release tag whose downloads the site serves, for example v0.7.0
        required: true
        type: string

permissions:
  contents: read

env:
  CARGO_BUILD_JOBS: "2"
  CARGO_INCREMENTAL: "0"

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Holds CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID.
    environment: release
    steps:
      - name: Check the Cloudflare secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID to the release environment, then re-run this job."
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag }}
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-08-17
          targets: wasm32-unknown-unknown
          components: rust-src
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: site
      - uses: jetli/trunk-action@v0.5.0
        with:
          version: "v0.21.14"
      - uses: oven-sh/setup-bun@v2
      - name: Fetch and verify the release download
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          # Once the Apple secrets exist, an unnotarized build must not reach the site.
          REQUIRE_NOTARIZED: ${{ secrets.APPLE_API_KEY_P8 != '' }}
        run: |
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern 'gpuicn-workspace-macos-arm64.zip*' --pattern 'showcase.json' \
            --dir web/public/downloads
          python3 - <<'PY'
          import hashlib, json, os, pathlib, subprocess
          folder = pathlib.Path("web/public/downloads")
          data = json.loads((folder / "showcase.json").read_text())
          archive = folder / "gpuicn-workspace-macos-arm64.zip"
          assert data["notarized"] is True or os.environ["REQUIRE_NOTARIZED"] != "true"
          assert data["url"] == "/downloads/" + archive.name
          assert data["architecture"] == "arm64"
          assert "v" + data["version"] == os.environ["RELEASE_TAG"]
          assert data["build"] == subprocess.check_output(["git", "rev-parse", "--short", "HEAD"], text=True).strip()
          assert data["bytes"] == archive.stat().st_size
          assert data["sha256"] == hashlib.sha256(archive.read_bytes()).hexdigest()
          PY
      - name: Build GPUI/WASM previews
        working-directory: site
        env:
          CARGO_UNSTABLE_BUILD_STD: std,panic_abort
        run: trunk build --release --public-url /demo/ --dist ../web/public/demo
      - name: Check every file fits Cloudflare's 25 MiB asset limit
        run: |
          ls -lS web/public/demo | head -n 5
          if find web/public/demo -type f -size +25M | grep .; then
            echo "::error::These files exceed Cloudflare Workers' 25 MiB asset limit, so the site can't deploy."
            exit 1
          fi
      - name: Build TanStack catalog
        working-directory: web
        run: |
          bun install --frozen-lockfile
          bun run build
      - name: Deploy static assets
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.129.0"
          command: deploy
