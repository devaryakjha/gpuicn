name: Release

# Merging a version bump to main is the release. This runs after CI passes on
# a push to main. When tag v<version> already points at an older commit, the
# version wasn't bumped and nothing happens. Otherwise it tags the commit,
# publishes gpuicn and then gpuicn-cli, builds the example apps, publishes the
# GitHub release and deploys ui.imajha.com. Every step skips work that is
# already done, so "Re-run failed jobs" is always safe.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  CARGO_INCREMENTAL: "0"

jobs:
  plan:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.plan.outputs.release }}
      version: ${{ steps.plan.outputs.version }}
      tag: ${{ steps.plan.outputs.tag }}
      sha: ${{ steps.plan.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/release-version.py check
          version="$(python3 scripts/release-version.py current)"
          tag="v$version"
          sha="$(git rev-parse HEAD)"
          {
            echo "version=$version"
            echo "tag=$tag"
            echo "sha=$sha"
          } >> "$GITHUB_OUTPUT"
          published() {
            curl -fsS -o /dev/null -A "gpuicn-release (https://github.com/devaryakjha/gpuicn)" \
              "https://crates.io/api/v1/crates/$1/$2"
          }
          # The peeled line (^{}) of an annotated tag comes last.
          tagged="$(git ls-remote origin "refs/tags/$tag" "refs/tags/$tag^{}" | tail -n 1 | cut -f 1)"
          if [ -n "$tagged" ] && [ "$tagged" != "$sha" ]; then
            echo "$tag is already released from ${tagged:0:7}; bump the version to release again."
            echo "release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -n "$tagged" ] && published gpuicn "$version" && published gpuicn-cli "$version" \
            && [ "$(gh release view "$tag" --json isDraft --jq .isDraft 2>/dev/null)" = "false" ]; then
            echo "$tag is fully released already."
            echo "release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          icons="$(python3 -c 'import tomllib; print(next(p["version"] for p in tomllib.load(open("Cargo.lock", "rb"))["package"] if p["name"] == "gpui-icons"))')"
          if ! published gpui-icons "$icons"; then
            echo "::error::gpuicn needs gpui-icons $icons, which is not on crates.io yet. Release gpui-icons first."
            exit 1
          fi
          echo "Releasing $tag from $sha"
          echo "release=true" >> "$GITHUB_OUTPUT"

  tag:
    needs: plan
    if: needs.plan.outputs.release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.sha }}
      - env:
          TAG: ${{ needs.plan.outputs.tag }}
        run: |
          if [ -n "$(git ls-remote origin "refs/tags/$TAG")" ]; then
            echo "$TAG exists"
          else
            git push origin "HEAD:refs/tags/$TAG"
          fi

  crates:
    needs: [plan, tag]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write # crates.io Trusted Publishing
    env:
      HAS_CARGO_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.sha }}
      - name: Free disk space for package verification
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - name: Install GPUI build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libfontconfig1-dev libxcb1-dev libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.1
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: publish
      - id: auth
        if: env.HAS_CARGO_TOKEN != 'true'
        uses: rust-lang/crates-io-auth-action@v1
      - name: Publish gpuicn, then gpuicn-cli
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN || steps.auth.outputs.token }}
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          for crate in gpuicn gpuicn-cli; do
            if curl -fsS -o /dev/null -A "gpuicn-release (https://github.com/devaryakjha/gpuicn)" \
              "https://crates.io/api/v1/crates/$crate/$VERSION"; then
              echo "$crate $VERSION is already on crates.io"
            else
              # Cargo waits until the crate is in the index before the next publish.
              cargo publish -p "$crate" --locked
            fi
          done

  apps:
    needs: [plan, tag]
    uses: ./.github/workflows/release-build.yml
    with:
      ref: ${{ needs.plan.outputs.sha }}
    secrets: inherit

  github-release:
    needs: [plan, crates, apps]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.sha }}
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.plan.outputs.tag }}
        run: |
          ls -l dist
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            # A draft stays hidden until every download is attached.
            gh release create "$TAG" dist/* --draft --verify-tag \
              --title "gpuicn $TAG" --notes-file "docs/releases/$TAG.md"
          fi
          gh release edit "$TAG" --draft=false --latest

  deploy:
    needs: [plan, github-release]
    uses: ./.github/workflows/cloudflare.yml
    with:
      release_tag: ${{ needs.plan.outputs.tag }}
    secrets: inherit
