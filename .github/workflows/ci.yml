name: CI

# The tiers of the Karya Labs engineering process (karyalabs/matty,
# docs/engineering-process.md, section 5.2):
#
# - T1, every pull request: fmt and clippy on macOS, the registry and
#   version checks, the package list, the WASM check and the website lint.
# - T2, the merge queue and every push to main (from release.yml, before
#   it releases): T1 plus
#   the macOS tests and the MSRV tests on Linux.
#
# The `tests` label runs T2 on a pull request (add it, then push). canary.yml builds Matty
# against this tree; verify.yml has the slow end-to-end checks a release
# runs.
#
# Jobs run on Karya's self-hosted runners when the organization variables
# KARYA_LINUX_RUNNER and KARYA_MACOS_RUNNER (or the older repository
# variables GPUICN_*_RUNNER) hold a runs-on value as JSON. Unset, they use
# GitHub's runners. Pull requests from forks always get GitHub's runners.
# See docs/ci.md.
on:
  pull_request:
  # The merge queue checks the tree about to land.
  merge_group:
  workflow_call:

# A new push to a pull request cancels its older run.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_INCREMENTAL: "0"

jobs:
  rust:
    runs-on: ${{ fromJSON((github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && (vars.KARYA_MACOS_RUNNER || vars.GPUICN_MACOS_RUNNER) || '"macos-15"') }}
    steps:
      - uses: actions/checkout@v4
        with:
          # A self-hosted runner keeps target/ warm between jobs; the next
          # step clears the rest.
          clean: ${{ runner.environment != 'self-hosted' }}
      - uses: karyalabs/.github/actions/self-hosted-prep@v1
      - uses: karyalabs/.github/actions/rust-toolchain@v1
        with:
          file: release-pins.toml
          key: rust.toolchain
          components: rustfmt, clippy
      # Self-hosted runners keep target/ instead.
      - if: runner.environment == 'github-hosted'
        uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked --features gpui_platform/runtime_shaders -- -D warnings
      - if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'tests')
        run: cargo test --workspace --locked --features gpui_platform/runtime_shaders

  linux:
    # Linux on the minimum supported Rust.
    runs-on: ${{ fromJSON((github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && (vars.KARYA_LINUX_RUNNER || vars.GPUICN_LINUX_RUNNER) || '"ubuntu-latest"') }}
    steps:
      - uses: actions/checkout@v4
        with:
          # A self-hosted runner keeps target/ warm between jobs; the next
          # step clears the rest.
          clean: ${{ runner.environment != 'self-hosted' }}
      - uses: karyalabs/.github/actions/self-hosted-prep@v1
      - name: Check every release version reference agrees
        run: python3 scripts/release-version.py check
      - name: Check ejectable components use no crate-private items
        # An ejected file reaches the crate through `super::`.
        run: if grep -rnE "pub\((crate|super)\)" crates/ui/registry; then exit 1; fi
      - id: msrv
        run: echo "version=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["rust-version"])')" >>"$GITHUB_OUTPUT"
      - uses: karyalabs/.github/actions/rust-toolchain@v1
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
      # Self-hosted runners keep target/ instead.
      - if: runner.environment == 'github-hosted'
        uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: karyalabs/.github/actions/gpui-deps@v1
      - if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'tests')
        run: cargo test -p gpuicn -p gpuicn-cli --locked
      - uses: oven-sh/setup-bun@v2
      - name: Check the generated registry is up to date
        run: |
          cargo run -q -p gpuicn-cli --locked -- build
          bun scripts/sync-catalog.mjs
          git diff --exit-code -- registry.json site/pages/r
      # Crate mode depends on the published crate, so its component source must package.
      - run: cargo package -p gpuicn --list --locked > /dev/null

  wasm:
    # Named wasm so branch protection that requires the old check keeps working.
    runs-on: ${{ fromJSON((github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && (vars.KARYA_LINUX_RUNNER || vars.GPUICN_LINUX_RUNNER) || '"ubuntu-latest"') }}
    steps:
      - uses: actions/checkout@v4
        with:
          # A self-hosted runner keeps target/ warm between jobs; the next
          # step clears the rest.
          clean: ${{ runner.environment != 'self-hosted' }}
      - uses: karyalabs/.github/actions/self-hosted-prep@v1
      - uses: karyalabs/.github/actions/rust-toolchain@v1
        with:
          toolchain: nightly-2026-08-17
          targets: wasm32-unknown-unknown
          components: rust-src
      # Self-hosted runners keep target/ instead.
      - if: runner.environment == 'github-hosted'
        uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Check the WASM preview compiles
        working-directory: site
        env:
          CARGO_UNSTABLE_BUILD_STD: std,panic_abort
        run: cargo check --bin showcase --target wasm32-unknown-unknown --locked
      # Astro runs on Node and refuses runner images older than its minimum
      # (22.23.4), so pin a current one instead of the image's default.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
      - name: Build and lint the website
        working-directory: web
        run: |
          bun install --frozen-lockfile
          bun run build
          bun run lint
          bun scripts/check-highlighting.ts
          bun scripts/check-platform-notes.ts
          bun ../scripts/check-preview-updates.mjs

  # The one check to wait on.
  ci:
    if: ${{ !cancelled() }}
    needs: [rust, linux, wasm]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - env:
          RESULTS: ${{ needs.rust.result }} ${{ needs.linux.result }} ${{ needs.wasm.result }}
        run: |
          echo "$RESULTS"
          for r in $RESULTS; do
            case "$r" in success|skipped) ;; *) exit 1 ;; esac
          done
