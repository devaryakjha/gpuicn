name: CI

on:
  pull_request:
  push:
    branches: [main]

env:
  CARGO_BUILD_JOBS: "2"
  CARGO_INCREMENTAL: "0"
  CARGO_TARGET_DIR: target

jobs:
  rust:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo test -p gpuicn --lib --locked
      - run: cargo clippy -p gpuicn --lib --tests --locked -- -D warnings
      - run: cargo check -p gpuicn-showcase --locked
      - name: Verify stock registry install
        run: |
          node scripts/build-registry.mjs
          npx -y shadcn@4.19.0 build registry.json --output site/pages/r
          git diff --exit-code -- registry.json site/pages/r
          items=()
          for item in "$PWD"/site/pages/r/*.json; do
            [[ "$item" == */registry.json ]] || items+=("$item")
          done
          npx -y shadcn@4.19.0 add "${items[@]}" --cwd "$PWD/fixtures/registry-install" --yes --overwrite
          for source in registry/*/*.rs; do
            cmp "$source" "fixtures/registry-install/src/ui/$(basename "$source")"
          done
          perl -0pi -e 's/The narrow shadcn Nova Dialog visual port/Changed by the overwrite gate/' fixtures/registry-install/src/ui/dialog.rs
          npx -y shadcn@4.19.0 add "$PWD/site/pages/r/dialog.json" --cwd "$PWD/fixtures/registry-install" --yes --overwrite
          cmp registry/dialog/dialog.rs fixtures/registry-install/src/ui/dialog.rs
      - run: cargo check --manifest-path fixtures/registry-install/Cargo.toml --locked

  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-08-17
          targets: wasm32-unknown-unknown
          components: rust-src
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: site
      - uses: jetli/trunk-action@v0.5.0
        with:
          version: "v0.21.14"
      - name: Build shared GPUI/WASM preview
        working-directory: site
        env:
          CARGO_UNSTABLE_BUILD_STD: std,panic_abort
        run: trunk build --release --public-url /gpuicn/demo/
