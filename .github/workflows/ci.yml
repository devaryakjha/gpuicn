name: CI

# Quick checks for every pull request, and for every push to main through
# release.yml, which also keeps the caches warm for pull requests. The slow
# end-to-end checks are in verify.yml and run only when a release happens.
#
# Jobs run on Karya's self-hosted runners when the repository variables
# GPUICN_LINUX_RUNNER and GPUICN_MACOS_RUNNER hold a runs-on value as JSON,
# such as ["self-hosted","Linux","X64","matty"]. Unset, they use GitHub's
# runners, so deleting a variable is the way back when a machine is down.
# Pull requests from forks always get GitHub's runners. See docs/ci.md.
on:
  pull_request:
  workflow_call:

# A new push to a pull request cancels its older run.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_INCREMENTAL: "0"

jobs:
  rust:
    runs-on: ${{ fromJSON((github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && vars.GPUICN_MACOS_RUNNER || '"macos-15"') }}
    steps:
      - uses: actions/checkout@v4
        with:
          # A self-hosted runner keeps target/ warm between jobs; the next
          # step clears the rest.
          clean: ${{ runner.environment != 'self-hosted' }}
      - if: runner.environment == 'self-hosted'
        run: scripts/ci/prepare-workspace
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.1
          components: rustfmt, clippy
      # Self-hosted runners keep target/ instead.
      - if: runner.environment == 'github-hosted'
        uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked --features gpui_platform/runtime_shaders -- -D warnings
      - run: cargo test --workspace --locked --features gpui_platform/runtime_shaders

  linux:
    # Linux on the minimum supported Rust.
    runs-on: ${{ fromJSON((github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && vars.GPUICN_LINUX_RUNNER || '"ubuntu-latest"') }}
    steps:
      - uses: actions/checkout@v4
        with:
          # A self-hosted runner keeps target/ warm between jobs; the next
          # step clears the rest.
          clean: ${{ runner.environment != 'self-hosted' }}
      - if: runner.environment == 'self-hosted'
        run: scripts/ci/prepare-workspace
      - name: Check every release version reference agrees
        run: python3 scripts/release-version.py check
      - name: Check ejectable components use no crate-private items
        # An ejected file reaches the crate through `super::`.
        run: if grep -rnE "pub\((crate|super)\)" crates/ui/registry; then exit 1; fi
      - uses: dtolnay/rust-toolchain@1.98.0
      # Self-hosted runners keep target/ instead.
      - if: runner.environment == 'github-hosted'
        uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install GPUI build dependencies
        run: scripts/ci/apt-install libfontconfig-dev libxcb1-dev libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev
      - run: cargo test -p gpuicn -p gpuicn-cli --locked
      - uses: oven-sh/setup-bun@v2
      - name: Check the generated registry is up to date
        run: |
          cargo run -q -p gpuicn-cli --locked -- build
          bun scripts/sync-catalog.mjs
          git diff --exit-code -- registry.json site/pages/r
      # Crate mode depends on the published crate, so its component source must package.
      - run: cargo package -p gpuicn --list --locked > /dev/null

  wasm:
    # Named wasm so branch protection that requires the old check keeps working.
    runs-on: ${{ fromJSON((github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && vars.GPUICN_LINUX_RUNNER || '"ubuntu-latest"') }}
    steps:
      - uses: actions/checkout@v4
        with:
          # A self-hosted runner keeps target/ warm between jobs; the next
          # step clears the rest.
          clean: ${{ runner.environment != 'self-hosted' }}
      - if: runner.environment == 'self-hosted'
        run: scripts/ci/prepare-workspace
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-08-17
          targets: wasm32-unknown-unknown
          components: rust-src
      # Self-hosted runners keep target/ instead.
      - if: runner.environment == 'github-hosted'
        uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Check the WASM preview compiles
        working-directory: site
        env:
          CARGO_UNSTABLE_BUILD_STD: std,panic_abort
        run: cargo check --bin showcase --target wasm32-unknown-unknown --locked
      # Astro runs on Node and refuses runner images older than its minimum
      # (22.23.4), so pin a current one instead of the image's default.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
      - name: Build and lint the website
        working-directory: web
        run: |
          bun install --frozen-lockfile
          bun run build
          bun run lint
          bun scripts/check-highlighting.ts
          bun scripts/check-platform-notes.ts
          bun ../scripts/check-preview-updates.mjs
