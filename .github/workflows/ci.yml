name: CI

on:
  pull_request:
  push:
    branches: [main]

env:
  CARGO_BUILD_JOBS: "2"
  CARGO_INCREMENTAL: "0"
  CARGO_TARGET_DIR: target

jobs:
  rust:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo test --workspace --locked --features gpui_platform/runtime_shaders
      - run: cargo clippy --workspace --all-targets --locked --features gpui_platform/runtime_shaders -- -D warnings
      - name: Verify native registry install
        run: |
          cargo run -p gpuicn-cli --locked -- build
          node scripts/sync-catalog.mjs
          cargo run -p gpuicn-cli --locked -- --config fixtures/registry-install/gpuicn.toml --registry ../../site/pages/r init
          cargo run -p gpuicn-cli --locked -- --config fixtures/registry-install/gpuicn.toml add --all
          cargo check --manifest-path fixtures/registry-install/Cargo.toml --bins --locked --features gpui_platform/runtime_shaders
          cargo test --manifest-path fixtures/registry-install/Cargo.toml --bin registry-install-fixture --locked --features gpui_platform/runtime_shaders
      - name: Verify stock registry install
        run: |
          git diff --exit-code -- registry.json site/pages/r
          items=()
          for item in "$PWD"/site/pages/r/*.json; do
            [[ "$item" == */registry.json ]] || items+=("$item")
          done
          npx -y shadcn@4.19.0 add "${items[@]}" --cwd "$PWD/fixtures/registry-install" --yes --overwrite
          for source in crates/ui/registry/*/*.rs; do
            cmp "$source" "fixtures/registry-install/src/ui/$(basename "$source")"
          done
          perl -0pi -e 's/Nova modal surfaces[^\n]+/Changed by the overwrite gate/' fixtures/registry-install/src/ui/dialog.rs
          npx -y shadcn@4.19.0 add "$PWD/site/pages/r/dialog.json" --cwd "$PWD/fixtures/registry-install" --yes --overwrite
          cmp crates/ui/registry/dialog/dialog.rs fixtures/registry-install/src/ui/dialog.rs
      - run: cargo check --manifest-path fixtures/registry-install/Cargo.toml --bins --locked --features gpui_platform/runtime_shaders

  linux:
    # Linux coverage on the minimum supported Rust, plus fresh apps in both modes
    # the way a new user sets them up.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.0
      - uses: Swatinem/rust-cache@v2
      - name: Install GPUI build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libfontconfig1-dev libxcb1-dev libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev
      - run: cargo test -p gpuicn-cli --locked
      - run: cargo test -p gpuicn --locked
      # Crate mode depends on the published crate, so its component source must package.
      - run: cargo package -p gpuicn --list --locked
      - name: Set up and check a new app
        run: |
          cargo build -p gpuicn-cli --locked
          GPUICN_RELEASE="$PWD" target/debug/gpuicn --registry "$PWD/site/pages/r" new "$RUNNER_TEMP/my-app"
          target/debug/gpuicn --config "$RUNNER_TEMP/my-app/gpuicn.toml" add alert_dialog select
          # Both throwaway apps share one GPUI build.
          CARGO_TARGET_DIR="$RUNNER_TEMP/apps-target" cargo check --manifest-path "$RUNNER_TEMP/my-app/Cargo.toml" --features gpui_platform/runtime_shaders
      - name: Set up a crate-mode app and eject every component
        run: |
          # An ejected file reaches the crate through `super::`, so nothing it names may be crate-private.
          if grep -rnE "pub\((crate|super)\)" crates/ui/registry; then exit 1; fi
          GPUICN_RELEASE="$PWD" target/debug/gpuicn --registry "$PWD/site/pages/r" new --crate "$RUNNER_TEMP/crate-app"
          cargo add --manifest-path "$RUNNER_TEMP/crate-app/Cargo.toml" gpuicn --path "$PWD/crates/ui"
          CARGO_TARGET_DIR="$RUNNER_TEMP/apps-target" cargo check --manifest-path "$RUNNER_TEMP/crate-app/Cargo.toml" --features gpui_platform/runtime_shaders
          target/debug/gpuicn --config "$RUNNER_TEMP/crate-app/gpuicn.toml" eject --all
          CARGO_TARGET_DIR="$RUNNER_TEMP/apps-target" cargo check --manifest-path "$RUNNER_TEMP/crate-app/Cargo.toml" --features gpui_platform/runtime_shaders

  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-08-17
          targets: wasm32-unknown-unknown
          components: rust-src
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: site
      - uses: jetli/trunk-action@v0.5.0
        with:
          version: "v0.21.14"
      - uses: oven-sh/setup-bun@v2
      - name: Build shared GPUI/WASM preview
        working-directory: site
        env:
          CARGO_UNSTABLE_BUILD_STD: std,panic_abort
        run: trunk build --release --public-url /demo/ --dist ../web/public/demo
      - name: Upload WASM preview
        uses: actions/upload-artifact@v4
        with:
          name: wasm-preview
          path: web/public/demo
          if-no-files-found: error
          retention-days: 7
      - name: Check TanStack catalog
        working-directory: web
        run: |
          bun install --frozen-lockfile
          bun run build
          bun run lint
          bun scripts/check-highlighting.ts
          bun scripts/check-platform-notes.tsx
          node ../scripts/check-preview-updates.mjs
