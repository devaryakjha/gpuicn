name: CI

on:
  pull_request:
  push:
    branches: [main]

env:
  CARGO_BUILD_JOBS: "2"
  CARGO_INCREMENTAL: "0"

jobs:
  rust:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo test -p imajha-ui --lib --locked
      - run: cargo clippy -p imajha-ui --lib --tests --locked -- -D warnings
      - run: cargo check -p imajha-ui-showcase --locked
