name: Build release downloads

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_BUILD_JOBS: "2"
  CARGO_INCREMENTAL: "0"

jobs:
  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked -p gpuicn-showcase --features gpui_platform/runtime_shaders
      - uses: actions/upload-artifact@v4
        with:
          name: showcase-macos-arm64
          path: target/release/showcase
          if-no-files-found: error
          retention-days: 7

  linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends build-essential pkg-config clang cmake libssl-dev libfontconfig1-dev libfreetype-dev libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libxcb1-dev libxcb-xkb-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}
      - run: python3 scripts/package-showcase-linux.py --target ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: showcase-${{ matrix.target }}
          path: target/linux-dist/*
          if-no-files-found: error
          retention-days: 7
