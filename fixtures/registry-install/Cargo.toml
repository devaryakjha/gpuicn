[package]
name = "registry-install-fixture"
version = "0.0.0"
edition = "2024"
rust-version = "1.98"
publish = false
default-run = "registry-install-fixture"

[dependencies]
web-time = "1.1"
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.10", features = ["font-kit"] }
gpui-icons = "=0.5.0"

gpui-kit = { version = "=0.8.1", default-features = false, features = ["component"] }

[dev-dependencies]
gpui-kit = { version = "=0.8.1", default-features = false, features = ["component", "test-support"] }

[workspace]

# Temporary until gpui-icons 0.5.0 is on crates.io.
[patch.crates-io]
gpui-icons = { git = "https://github.com/devaryakjha/gpui-icons", rev = "4976396f2de2f2e0ebbfe843b82898a5d580880f" }
