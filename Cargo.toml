[workspace]
members = ["crates/ui", "crates/cli", "site", "xtask"]
resolver = "3"

[workspace.package]
version = "0.9.7"
edition = "2024"
rust-version = "1.98"
license = "MIT"
repository = "https://github.com/karyalabs/gpuicn"

[workspace.dependencies]
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.11", features = ["font-kit"] }
gpui-kit = { version = "=0.9.0", default-features = false, features = ["component"] }
gpui-icons = "0.6.0"

[profile.dev]
debug = 1

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 1
strip = "debuginfo"

# The browser preview downloads the whole WASM binary before it can draw, so
# it trades build time for size: fat LTO and size-first optimization.
[profile.web]
inherits = "release"
opt-level = "z"
lto = "fat"
