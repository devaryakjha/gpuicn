[workspace]
members = ["crates/ui", "crates/cli", "crates/gpui-compat", "site"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.97.1"
license = "MIT"
repository = "https://github.com/devaryakjha/gpuicn"

[workspace.dependencies]
base-gpui = { git = "https://github.com/LukeTandjung/base-gpui", rev = "64b22337b6a790c636aab248e768e4875bb28ba8", package = "base-gpui" }
gpui = { package = "gpui-pre", version = "=0.3.4" }
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.4", features = ["font-kit"] }
gpui-kit = { version = "=0.6.1", default-features = false }
gpui-base = "=0.6.1"
gpui-icons = { git = "https://github.com/devaryakjha/gpui-icons", rev = "01ac07dd83e97f9d6a3526466413732fbdfc2975" }

# Retained Base GPUI uses the same runtime as GPUI Kit.
[patch."https://github.com/zed-industries/zed"]
gpui = { path = "crates/gpui-compat" }

[profile.dev]
debug = 1

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 1
strip = "debuginfo"
