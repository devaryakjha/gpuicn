[workspace]
members = ["crates/ui", "crates/cli", "site"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.97.1"
license = "MIT"
repository = "https://github.com/devaryakjha/gpuicn"

[workspace.dependencies]
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.5", features = ["font-kit"] }
gpui-kit = { version = "=0.6.4", default-features = false, features = ["component"] }
gpui-icons = { git = "https://github.com/devaryakjha/gpui-icons", rev = "39e74ddd9c2384bb58cc077befbf8c07e545aea0" }

[profile.dev]
debug = 1

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 1
strip = "debuginfo"
