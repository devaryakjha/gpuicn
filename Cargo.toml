[workspace]
members = ["crates/ui", "crates/cli", "site"]
resolver = "3"

[workspace.package]
version = "0.5.0"
edition = "2024"
rust-version = "1.98"
license = "MIT"
repository = "https://github.com/devaryakjha/gpuicn"

[workspace.dependencies]
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.10", features = ["font-kit"] }
gpui-kit = { version = "=0.8.1", default-features = false, features = ["component"] }
gpui-icons = "0.5.0"

[profile.dev]
debug = 1

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 1
strip = "debuginfo"

# Temporary until gpui-icons 0.5.0 is on crates.io.
[patch.crates-io]
gpui-icons = { git = "https://github.com/devaryakjha/gpui-icons", rev = "e4b410f06acfc1471c1003d29d812b9bb061d1c8" }
